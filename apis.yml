aid: vastuhfc
name: Vastu Housing Finance Corporation
description: >-
  Vastu Housing Finance Corporation Limited (Vastu HFC) is an Indian,
  technology-enabled affordable housing finance company backed by Norwest
  Venture Partners. It provides home purchase, construction, extension, and
  improvement loans, plot-plus-construction loans, commercial property loans,
  and loans against property through 200+ branches across 17 states, serving
  1.6+ million customers, and participates in government subsidy schemes such
  as Pradhan Mantri Awas Yojana Urban 2.0. Vehicle, business, and
  construction-equipment lending is offered through its subsidiary Vastu
  Finserve. The company operates as a digital-first lender with a customer
  mobile app, but publishes no public developer portal or API surface.
